<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Bordplassering</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#ADD8E6;
  padding:20px;
}

h2{ margin:30px 0 10px; }

#guests{ margin-bottom:40px; }

.guest{
  padding:6px 10px;
  border:1px solid #333;
  margin:4px;
  display:inline-block;
  cursor:grab;
  background:#fff;
  font-size:12px;
  white-space:nowrap;
}

/* ===== ROM ===== */
.tables{
  position:relative;
  height:2500px;
}

.table-wrapper{
  position:absolute;
  display:flex;
  flex-direction:column;
  align-items:center;
  transform-origin:center center;
}

.table-title{
  font-weight:bold;
  margin-bottom:6px;
}

/* ===== BORD ===== */
.table{
  background:#FFC0CB;
  padding:10px;
  border:4px solid #444;

  display:grid;
  grid-template-columns: 36px 36px;
  grid-auto-rows: 36px;
  gap:6px;
}

/* ===== STOL ===== */
.seat{
  border:1px dashed #999;
  background:#fafafa;
}

/* ===== NAVN I STOL ===== */
.seat .guest{
  box-sizing:border-box;

  width:36px;
  height:36px;

  padding:3px;
  border:1px solid #555;
  background:#dff0ff;

  font-size:9px;
  line-height:1.1;

  white-space:normal;
  word-break:break-word;

  position:relative;
  top:-5px;
  left:-5px;
}

</style>
</head>

<body>

<h2>Gjester</h2>
<div id="guests"></div>

<h2>Bordplassering</h2>
<div class="tables" id="tables"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwWgZferc0FqUduSbu-PqSEX4yARsNtFzHVUXXXLmHDa248vHUhUhOWChKMUDJWGXfdwQ/exec";
const CELL_SIZE = 36;

/* ================= ROM ================= */
function drawRoom(room, tableProps){
  const container = document.getElementById("tables");
  container.innerHTML = "";

  room.forEach((row,r)=>{
    row.forEach((cell,c)=>{
      if(!cell) return;

      const info = tableProps[cell] || {rotation:0,seats:30};

      const wrapper = document.createElement("div");
      wrapper.className="table-wrapper";
      wrapper.style.left = c*CELL_SIZE+"px";
      wrapper.style.top  = r*CELL_SIZE+"px";
      wrapper.style.transform = `rotate(${info.rotation}deg)`;

      const title = document.createElement("div");
      title.className="table-title";
      title.textContent="Bord "+cell;

      const table = document.createElement("div");
      table.className="table";

      /* ===== VENSTRE SIDE FØRST ===== */
      for(let i=0;i<info.seats;i++){
        const seat=document.createElement("div");
        seat.className="seat";

        const seatId=`bord-${cell}-L-${i+1}`;
        seat.dataset.seatId=seatId;

        enableSeatDrop(seat, cell, seatId);
        table.appendChild(seat);
      }

      /* ===== HØYRE SIDE ===== */
      for(let i=0;i<info.seats;i++){
        const seat=document.createElement("div");
        seat.className="seat";

        const seatId=`bord-${cell}-R-${i+1}`;
        seat.dataset.seatId=seatId;

        enableSeatDrop(seat, cell, seatId);
        table.appendChild(seat);
      }

      wrapper.appendChild(title);
      wrapper.appendChild(table);
      container.appendChild(wrapper);
    });
  });
}

/* ================= DROP PÅ STOL ================= */
function enableSeatDrop(seat, table, seatId){
  seat.addEventListener("dragover",e=>e.preventDefault());

  seat.addEventListener("drop",e=>{
    e.preventDefault();

    const id=e.dataTransfer.getData("id");
    const guest=document.querySelector(`.guest[data-id="${id}"]`);
    if(!guest) return;

    seat.appendChild(guest);

    fetch(API,{
      method:"POST",
      body:JSON.stringify({id,table,seatId})
    });
  });
}

/* ================= GJESTER ================= */
function drawGuests(guests){
  const container=document.getElementById("guests");

  guests.forEach(g=>{
    const el=document.createElement("div");
    el.className="guest";
    el.textContent=g.name;
    el.draggable=true;
    el.dataset.id=g.id;

    el.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("id",g.id);
    });

    if(g.seatId){
      const seat=document.querySelector(`.seat[data-seat-id="${g.seatId}"]`);
      if(seat){
        seat.appendChild(el);
        return;
      }
    }

    container.appendChild(el);
  });
}

/* ================= AUTO SCROLL ================= */
document.addEventListener("dragover",e=>{
  const y=e.clientY;
  const h=window.innerHeight;
  if(y<80) window.scrollBy(0,-15);
  if(y>h-80) window.scrollBy(0,15);
});

/* ================= SLIPP PÅ BAKGRUNN ================= */
document.body.addEventListener("dragover",e=>e.preventDefault());

document.body.addEventListener("drop",e=>{
  if(e.target.closest(".seat")||e.target.closest("#guests")) return;

  const id=e.dataTransfer.getData("id");
  const guest=document.querySelector(`.guest[data-id="${id}"]`);
  if(!guest) return;

  document.getElementById("guests").prepend(guest);

  fetch(API,{
    method:"POST",
    body:JSON.stringify({id,table:"",seatId:""})
  });
});

/* ================= HENT DATA ================= */
fetch(API)
  .then(r=>r.json())
  .then(data=>{
    drawRoom(data.room, data.tables);
    drawGuests(data.guests);
  });
</script>

</body>
</html>
