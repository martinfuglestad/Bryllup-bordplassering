<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bordplassering</title>
  <style>
    body { font-family: sans-serif; }
    .guest {
      padding: 6px 10px;
      border: 1px solid #333;
      margin: 4px;
      display: inline-block;
      cursor: grab;
      background: #eee;
    }
    .table {
      width: 200px;
      height: 200px;
      border: 2px dashed #666;
      margin: 10px;
      display: inline-block;
      vertical-align: top;
    }
  </style>
</head>
<body>

<h3>Gjester</h3>
<div id="guests"></div>

<h3>Bord</h3>
<div class="table" data-table="1">Bord 1</div>
<div class="table" data-table="2">Bord 2</div>
<div class="table" data-table="3">Bord 3</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzkvVA7b050GKpx0mXLwwGUXs16VnUNqRE4QiA1asEmaLyI9pm55NtmYSZdslozAtDc7A/exec";

fetch(API)
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById("guests");
    data.forEach(g => {
      const el = document.createElement("div");
      el.className = "guest";
      el.textContent = g.name;
      el.draggable = true;
      el.dataset.id = g.id;
      el.addEventListener("dragstart", e => {
        e.dataTransfer.setData("id", g.id);
      });
      container.appendChild(el);
    });
  });

document.querySelectorAll(".table").forEach(t => {
  t.addEventListener("dragover", e => e.preventDefault());
  t.addEventListener("drop", e => {
    const id = e.dataTransfer.getData("id");
    const table = t.dataset.table;

    fetch(API, {
      method: "POST",
      body: JSON.stringify({ id, table })
    });

    alert("Plassert på bord " + table);
  });
});
</script>

</body>
</html>
